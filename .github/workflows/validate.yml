name: Validate GR02 notebooks and Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pandas>=2.1,<3" "scikit-learn>=1.3,<2"
      - name: Run tests (including notebook syntax)
        run: python -m pytest -q
